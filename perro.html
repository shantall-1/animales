<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animales Favoritos</title>
  <style>

    body {
      margin: 0;
      padding: 20px;
      background-color: #f7f4fc;
      text-align: center;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 15px;
    }

    .titulo {
      background-color: rgb(212, 189, 233);
      padding: 10px;
      border-radius: 10px;
    }

    .titulo h1 {
      margin: 0;
      color: #333;
    }

    .animal img {
      width: 90%;
      max-width: 350px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .animal h2 {
      color: #444;
      margin-top: 15px;
    }

    .animal p {
      color: #555;
      font-size: 16px;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="titulo">
      <h1>PERRO</h1>
    </div>

    <div class="animal">
      <img src="https://i.pinimg.com/736x/92/54/31/925431b21fb614920366d24e589700ba.jpg" alt="Chihuahua">
      <h2>Chihuahua</h2>
      <p>
        El chihuahua es uno de los perros más pequeños del mundo. 
        Es originario de México y destaca por ser valiente, alegre y muy cariñoso con su familia. 
        Aunque tenga un tamaño diminuto, tiene un gran corazón.
      </p>
    </div>
  </div>
<div>
    <img src="https://static.vecteezy.com/system/resources/previews/042/570/910/non_2x/one-continuous-line-drawing-dogs-with-toys-and-accessories-image-single-line-minimal-style-dog-portrait-black-and-white-seamless-border-lovely-hand-drawn-horizontal-seamless-pattern-vector.jpg" alt="">
</div>
</body>
</html>
